<section class="mx-auto flex min-h-[85vh] w-11/12 max-w-4xl flex-col justify-center py-24 md:w-4/6">

  <p class="section-label mb-6">{{ lang.t(ui.role) }}</p>

  <h1 class="hero-name mb-5 text-white">Leonardo Gurgitano</h1>

  <div class="hero-rule mb-7"></div>

  <p class="mb-3 flex flex-wrap items-center gap-x-3 gap-y-1 text-lg text-zinc-300">
    <span>.NET</span>
    <span class="text-zinc-600">·</span>
    <span>{{ lang.current === 'es' ? 'APIs RESTful' : 'RESTful APIs' }}</span>
    <span class="text-zinc-600">·</span>
    <span>SQL Server</span>
    <span class="text-zinc-600">·</span>
    <span>Angular</span>
    <span class="text-zinc-600">·</span>
    <span class="ai-tooling">
      <span class="ai-sparkle" aria-hidden="true">&#10022;</span>
      <span class="ai-shimmer">{{ lang.t(ui.techAi) }}</span>
    </span>
  </p>

  <p class="mb-10 flex items-center gap-2 text-sm text-zinc-500">
    <span class="inline-block h-1.5 w-1.5 rounded-full bg-cyan-400"></span>
    {{ lang.t(ui.location) }}
  </p>

  <p class="bio mb-4 max-w-2xl leading-relaxed" [innerHTML]="lang.t(ui.bio1)"></p>

  <p class="bio mb-4 max-w-2xl leading-relaxed" [innerHTML]="lang.t(ui.bio2)"></p>

  <p class="bio mb-10 max-w-2xl leading-relaxed" [innerHTML]="lang.t(ui.bio3)"></p>

  <div class="flex flex-wrap items-center gap-x-8 gap-y-4">
    <a
      href="#experience"
      class="inline-flex items-center gap-2 rounded-full border border-cyan-400/40 px-6 py-3 text-sm text-cyan-300 transition hover:border-cyan-400 hover:bg-cyan-400/10"
    >
      {{ lang.t(ui.ctaWork) }}
      <span aria-hidden="true">&darr;</span>
    </a>

    <a
      href="https://www.linkedin.com/in/LeonardoGurgitano/"
      target="_blank"
      rel="noopener noreferrer"
      class="link-cta"
    >
      LinkedIn
      <span aria-hidden="true">&rarr;</span>
    </a>
  </div>

</section>
